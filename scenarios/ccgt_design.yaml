# AMTS Energython 2026 — CCPP Design Scenario (locked engineering baseline)
# Source: technical-team-research/research/ (CS#1 consolidated design research).
# This supersedes the illustrative placeholder values in baselines.yaml.
# Units/values cross-referenced: Kawasaki GPB80D datasheet, research/01-ccpp-design-report.md.

plant:
  # 2x1 CCGT: 2 gas turbines + 1 steam turbine (steam bottoming, NOT absorption chilling)
  gas_turbine_count: 2
  gas_turbine_capacity_mw: 7.67      # Kawasaki GPB80D (M7A-03D), ISO 15C
  steam_turbine_capacity_mw: 4.72    # Siemens SST-200 condensing
  gross_capacity_mw: 20.06           # summed above
  parasitic_load_mw: 0.46            # station auxiliary / house load
  net_capacity_mw: 19.60             # ~19.60-20.00 net envelope
  combined_cycle_efficiency: 0.44    # 43.5-45.0%
  grid: "TCN 33 kV, grid-tied, 50 Hz"
  generation_voltage_kv: 6.6
  step_up_transformer_mva: 15        # 2x 15 MVA, 6.6/33 kV
  configuration: "2x1 CCGT — 2x Kawasaki GPB80D + Siemens SST-200"

engine:
  # M7A-03D gas turbine (per relationship with fuel input)
  electrical_efficiency_simple_cycle: 0.333
  heat_rate_kj_kwh: 10820
  exhaust_mass_flow_kg_per_s: 27.11
  exhaust_temp_c: 526
  availability: 0.95                 # placeholder; refine with reliability model
  forced_outage_rate: 0.05           # placeholder

steam_turbine:
  model: "Siemens SST-200 condensing"
  inlet_pressure_bar: 38
  inlet_temp_c: 420
  steam_flow_t_per_h: 34.0           # HRSG yield @ design point
  rankine_cycle_efficiency: 0.28

hrsg:
  type: "dual-inlet, single-pressure, unfired"
  steam_flow_range_t_per_h: [34.0, 40.0]
  thermal_recovery_efficiency: 0.83  # ~82-85%
  stack_temp_c: 140                  # acid dew-point floor
  pinch_point_delta_c: [10, 15]

fuel:
  # CNG "virtual pipeline" — truck-delivered compressed natural gas
  type: "CNG"
  lhv_mj_per_nm3: 35.9
  volumetric_flow_nm3_per_h: 4623
  mass_flow_kg_per_h: 3315
  energy_mmbtu_per_h: 157.3          # 2x ~78.66 MMBtu/hr at full CCGT output
  storage: "2x pressure-equalized vessels, ~250 bar, truck offload"
  price_usd_mmbtu: null              # RESEARCH PENDING — delivered Nigeria CNG price
  price_escalation_pct_per_yr: null  # RESEARCH PENDING

data_center:
  # CS#1 load profiling — demand side (mixed baseline chosen for shark pitch)
  baseline_load_profile: "mixed"
  alternate_profiles: ["ai_heavy", "cloud_heavy"]
  it_capacity_mw: 12.0               # net IT at full deployment
  facility_capacity_mw: 15.0
  target_pue: 1.25                   # tropical, hybrid liquid cooling
  phases_mw: [10, 15, 20]

ppa:
  energy_price_usd_kwh: null         # RESEARCH PENDING — PPA energy tariff
  capacity_payment_usd_month: null   # RESEARCH PENDING
  escalation_pct_per_yr: null        # RESEARCH PENDING
  contract_years: 20                 # placeholder; typical for independent power

# Legacy placeholder values from baselines.yaml are IGNORED for the CCGT scenario:
#   plant.engine_count: 5, engine_capacity_mw: 3, electrical_efficiency: 0.40,
#   cooling.heat_recovery_efficiency / absorption_chiller_cop (no absorption chilling in CCGT).